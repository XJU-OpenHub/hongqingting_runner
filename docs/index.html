<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hongqingting</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <h1>hongqingting</h1>
  </header>

  <div class="runner-layout">

    <!-- ===== Config ===== -->
    <div class="card" id="card-config">
      <h3>配置导入</h3>
      <p class="status-line" id="config-status">尚未导入配置。粘贴你的 JSON 或选择文件。</p>
      <textarea class="config-input" id="config-input" placeholder='{
  "proxyUrl": "https://xxx-xxx.trycloudflare.com",
  "authUrl": "http://your-mock.example.com/cloud/DflyServer",
  "summaryUrl": "http://your-mock.example.com/.../getRunDataSummary",
  "uploadUrl": "http://your-mock.example.com/.../uploadRunData",
  "schoolNo": "10755",
  "passwordPrefix": "Stu",
  "queryUid": "...",
  "uidList": "uid_a\nuid_b\nuid_c"
}'></textarea>
      <div style="margin-top: 10px;">
        <button class="btn" id="btn-load-config">导入</button>
        <input type="file" id="config-file" accept="application/json,.json" style="display:none" />
        <button class="btn secondary" id="btn-pick-file">选择文件</button>
        <button class="btn secondary" id="btn-clear-config">清空</button>
      </div>
    </div>

    <div class="split-2col">

      <div class="card">
        <h3>查询跑步里程</h3>
        <div class="field-grid">
          <div class="field"><label>学号</label><input id="sum-no" type="text" placeholder="20221303205" /></div>
        </div>
        <button class="btn" id="btn-summary">查询</button>
        <div class="result-panel" id="result-summary"></div>
      </div>

      <div class="card">
        <h3>批量上传跑步数据</h3>
        <div class="field-grid">
          <div class="field"><label>学号</label><input id="b-no" type="text" placeholder="20221303205" /></div>
          <div class="field">
            <label>轨迹</label>
            <select id="b-track">
              <option value="location_1km">location_1km · 1.0 km</option>
              <option value="location_1_16km">location_1_16km · 1.16 km</option>
              <option value="location_1_6km" selected>location_1_6km · 1.6 km</option>
              <option value="location_12km">location_12km · 12 km</option>
            </select>
          </div>
          <div class="field"><label>距离 米</label><input id="b-distance" type="number" step="any" value="1600" /></div>
          <div class="field"><label>用时基线 秒</label><input id="b-usetime" type="number" value="320" /></div>
          <div class="field"><label>起始 dayOffset</label><input id="b-start-day" type="number" step="0.1" value="0" /></div>
          <div class="field"><label>共多少次</label><input id="b-count" type="number" value="5" /></div>
          <div class="field"><label>每次间隔 秒</label><input id="b-delay" type="number" value="2" /></div>
          <div class="field">
            <label>UID 序号</label>
            <select id="b-uid"></select>
          </div>
        </div>
        <button class="btn" id="btn-batch-start">开始</button>
        <button class="btn secondary" id="btn-batch-stop" disabled>停止</button>
        <div class="batch-log" id="batch-log"></div>
      </div>

    </div>

  </div>

  <script>
  // ============ Config state ===============================================
  const CONFIG_KEY = "hongqingting_runner.config.v1";
  let CFG = null;

  function loadConfigFromStorage() {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  }
  function saveConfig(cfg) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  }
  function clearConfig() {
    localStorage.removeItem(CONFIG_KEY);
  }
  function validateConfig(cfg) {
    const required = ["proxyUrl", "authUrl", "summaryUrl", "uploadUrl",
                      "schoolNo", "passwordPrefix", "queryUid", "uidList"];
    for (const k of required) if (!(k in cfg)) throw new Error("缺少字段: " + k);
    if (typeof cfg.uidList !== "string") throw new Error("uidList 应为换行分隔的字符串");
    for (const k of ["proxyUrl", "authUrl", "summaryUrl", "uploadUrl"]) {
      const v = String(cfg[k] || "").trim();
      if (!/^https?:\/\//i.test(v)) {
        throw new Error(`${k} 必须以 http:// 或 https:// 开头，当前: "${v}"`);
      }
    }
    return true;
  }
  function uidArray(cfg) {
    return (cfg.uidList || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  }

  function refreshConfigUI() {
    const status = document.getElementById("config-status");
    if (!CFG) {
      status.textContent = "尚未导入配置。粘贴你的 JSON 或选择文件。";
      status.classList.remove("loaded");
      const sel = document.getElementById("b-uid");
      sel.innerHTML = '<option value="">--</option>';
      return;
    }
    const arr = uidArray(CFG);
    status.classList.add("loaded");
    status.textContent =
      `已加载: proxy=${CFG.proxyUrl} | schoolNo=${CFG.schoolNo} | uid 数=${arr.length}`;
    const sel = document.getElementById("b-uid");
    sel.innerHTML = "";
    arr.forEach((u, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = `[${i}] ${u.slice(0, 24)}…`;
      sel.appendChild(opt);
    });
  }

  // ============ HTTP helpers ===============================================
  async function callProxy(path, body) {
    if (!CFG) throw new Error("未加载配置");
    const url = CFG.proxyUrl.replace(/\/+$/, "") + path;
    const resp = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    const text = await resp.text();
    let data;
    try { data = JSON.parse(text); } catch { data = {raw: text}; }
    if (!resp.ok) {
      const err = new Error(`代理返回 ${resp.status}`);
      err.detail = data;
      throw err;
    }
    return data;
  }

  async function fetchTrack(name) {
    const r = await fetch(`assets/${name}`);
    if (!r.ok) throw new Error(`轨迹文件 ${name} 加载失败 (${r.status})`);
    return await r.text();
  }

  // ============ Render helpers =============================================
  function renderResult(elId, data, badgeText, badgeKind) {
    const el = document.getElementById(elId);
    el.innerHTML = "";
    const top = document.createElement("div");
    const badge = document.createElement("span");
    badge.className = `badge ${badgeKind}`;
    badge.textContent = badgeText;
    top.appendChild(badge);
    el.appendChild(top);

    if (data && data.upstreamStatus !== undefined) {
      const line = document.createElement("div");
      line.className = "status-line";
      line.textContent = `upstreamStatus = ${data.upstreamStatus}`;
      el.appendChild(line);
    }
    if (data && data.parsed) {
      const p = document.createElement("pre");
      p.textContent = "解析结果:\n" + JSON.stringify(data.parsed, null, 2);
      el.appendChild(p);
    }
    if (data && data.upstreamBody !== undefined) {
      const d = document.createElement("details");
      d.className = "debug-section";
      d.open = !data.parsed;
      d.innerHTML = `<summary>上游响应原文</summary><pre></pre>`;
      d.querySelector("pre").textContent = data.upstreamBody;
      el.appendChild(d);
    }
    if (data && data.debug) {
      const d = document.createElement("details");
      d.className = "debug-section";
      d.innerHTML = `<summary>请求构造细节（教学）</summary><pre></pre>`;
      d.querySelector("pre").textContent = JSON.stringify(data.debug, null, 2);
      el.appendChild(d);
    }
    if (data && data.detail) {
      const d = document.createElement("details");
      d.className = "debug-section";
      d.open = true;
      d.innerHTML = `<summary>错误详情</summary><pre></pre>`;
      d.querySelector("pre").textContent = JSON.stringify(data.detail, null, 2);
      el.appendChild(d);
    }
  }

  // ============ Wire up: config ============================================
  document.getElementById("btn-load-config").onclick = () => {
    const txt = document.getElementById("config-input").value.trim();
    try {
      const cfg = JSON.parse(txt);
      validateConfig(cfg);
      CFG = cfg; saveConfig(cfg); refreshConfigUI();
      alert("配置已导入");
    } catch (e) { alert("导入失败: " + e.message); }
  };
  document.getElementById("btn-pick-file").onclick = () => {
    document.getElementById("config-file").click();
  };
  document.getElementById("config-file").onchange = (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      document.getElementById("config-input").value = r.result;
      document.getElementById("btn-load-config").click();
    };
    r.readAsText(f);
  };
  document.getElementById("btn-clear-config").onclick = () => {
    if (!confirm("清空已导入的配置？")) return;
    CFG = null; clearConfig(); document.getElementById("config-input").value = "";
    refreshConfigUI();
  };

  // ============ Wire up: summary ===========================================
  document.getElementById("btn-summary").onclick = async () => {
    const no = document.getElementById("sum-no").value.trim();
    if (!no) return alert("请输入学号");
    if (!CFG) return alert("请先导入配置");
    try {
      const data = await callProxy("/proxy/summary", {
        summaryUrl: CFG.summaryUrl,
        schoolNo: CFG.schoolNo,
        studentNo: no,
        queryUid: CFG.queryUid,
      });
      renderResult("result-summary", data, "OK", "ok");
    } catch (e) {
      renderResult("result-summary", e.detail || {error: e.message}, "ERR", "err");
    }
  };

  // ============ Wire up: upload ============================================
  async function doUpload({no, track, distance, baseUseTime, useTimeJitter, day, uidIdx}) {
    const arr = uidArray(CFG);
    if (uidIdx < 0 || uidIdx >= arr.length) throw new Error("uid 序号越界");
    const locationText = await fetchTrack(track);
    return await callProxy("/proxy/upload", {
      uploadUrl: CFG.uploadUrl,
      schoolNo: CFG.schoolNo,
      studentNo: no,
      uid: arr[uidIdx],
      distance: Number(distance),
      locationText,
      dayOffset: Number(day),
      baseUseTime: Number(baseUseTime),
      useTimeJitter: Number(useTimeJitter),
    });
  }

  // ============ Wire up: batch =============================================
  let batchAbort = false;
  function logBatch(line) {
    const el = document.getElementById("batch-log");
    el.textContent += line + "\n";
    el.scrollTop = el.scrollHeight;
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  document.getElementById("btn-batch-start").onclick = async () => {
    if (!CFG) return alert("请先导入配置");
    const no = document.getElementById("b-no").value.trim();
    if (!no) return alert("请输入学号");
    const track    = document.getElementById("b-track").value;
    const distance = document.getElementById("b-distance").value;
    const baseUseTime = document.getElementById("b-usetime").value;
    const startDay = parseFloat(document.getElementById("b-start-day").value);
    const count    = parseInt(document.getElementById("b-count").value, 10);
    const delaySec = parseFloat(document.getElementById("b-delay").value);
    const uidIdx   = parseInt(document.getElementById("b-uid").value, 10);

    document.getElementById("btn-batch-start").disabled = true;
    document.getElementById("btn-batch-stop").disabled = false;
    document.getElementById("batch-log").textContent = "";
    batchAbort = false;

    for (let i = 0; i < count && !batchAbort; i++) {
      const day = startDay + i;
      logBatch(`[${i + 1}/${count}] dayOffset=${day} 开始…`);
      try {
        const data = await doUpload({
          no, track, distance, baseUseTime,
          useTimeJitter: 600, day, uidIdx,
        });
        const dbg = data.debug || {};
        logBatch(`  ✓ status=${data.upstreamStatus}  ${dbg.begintimeFormatted} → ${dbg.endtimeFormatted}  ${dbg.distanceMeters}m / ${dbg.usetimeSeconds}s`);
        logBatch(`  ↳ upstream: ${(data.upstreamBody || "").slice(0, 200)}`);
      } catch (e) {
        logBatch(`  ✗ ${e.message} ${e.detail ? JSON.stringify(e.detail).slice(0,200) : ""}`);
      }
      if (i < count - 1 && !batchAbort) {
        logBatch(`  · 等待 ${delaySec}s`);
        await sleep(delaySec * 1000);
      }
    }
    logBatch(batchAbort ? "已停止" : "完成");
    document.getElementById("btn-batch-start").disabled = false;
    document.getElementById("btn-batch-stop").disabled = true;
  };
  document.getElementById("btn-batch-stop").onclick = () => { batchAbort = true; };

  // ============ Init =======================================================
  CFG = loadConfigFromStorage();
  if (CFG) {
    document.getElementById("config-input").value = JSON.stringify(CFG, null, 2);
  }
  refreshConfigUI();
  </script>
</body>
</html>
